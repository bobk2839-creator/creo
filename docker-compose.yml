version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: fuelprocess-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fueluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelpass123}
      POSTGRES_DB: ${POSTGRES_DB:-fuelprocess}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fueluser} -d ${POSTGRES_DB:-fuelprocess}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuelprocess-network

  redis:
    image: redis:7-alpine
    container_name: fuelprocess-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuelprocess-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelprocess-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fueluser}:${POSTGRES_PASSWORD:-fuelpass123}@postgres:5432/${POSTGRES_DB:-fuelprocess}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && 
             python -m app.main"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fuelprocess-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuelprocess-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - fuelprocess-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelprocess-celery-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fueluser}:${POSTGRES_PASSWORD:-fuelpass123}@postgres:5432/${POSTGRES_DB:-fuelprocess}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info
    networks:
      - fuelprocess-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelprocess-celery-beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fueluser}:${POSTGRES_PASSWORD:-fuelpass123}@postgres:5432/${POSTGRES_DB:-fuelprocess}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A app.core.celery_app beat --loglevel=info
    networks:
      - fuelprocess-network

volumes:
  postgres_data:
  redis_data:

networks:
  fuelprocess-network:
    driver: bridge
