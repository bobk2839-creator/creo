version: '3.8'

services:
  bot:
    build: .
    container_name: omnivoice_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Для GPU поддержки (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    # Для CPU версии просто уберите секцию deploy выше
    # и добавьте ограничения ресурсов при необходимости
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Опционально: Redis для кеширования и rate limiting
